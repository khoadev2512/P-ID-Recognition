data:
  coco_json: ${data_root}/canonical/annotations.coco.json
  classes_yaml: ${data_root}/canonical/classes.yaml
  manifest_csv: ${data_root}/canonical/manifest.csv
  label_level: coarse
  tiling:
    size: 1024
    overlap: 0.2
    min_visibility: 0.6
  split:
    ratios:
      train: 0.8
      val: 0.2
    seed: ${seed}
detector:
  weights: yolov8m.pt
  label_level: coarse
  imgsz: 1024
  epochs: 100
  batch: 16
  aug:
    mosaic: 1.0
    degrees: 0.0
    hsv_v: 0.4
    scale: 0.5
  sahi:
    slice_size: 1024
    overlap_ratio: 0.2
  wbf:
    iou_thr: 0.55
    skip_box_thr: 0.001
fgc:
  backbone: resnet34
  pretrained: true
  imgsz: 128
  epochs: 60
  batch: 128
  groups:
  - valve
  - instrument_bubble
  - fitting
  loss: focal
  balanced_sampler: true
  metric_learning: false
  aug:
    hflip: 0.0
    rotate: 0
    jitter: 0.2
  route:
    min_score: 0.25
eval:
  mode: det_plus_fgc
  iou_thrs:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  score_thr: 0.25
  per_class_ap: true
  topk:
  - 1
  - 3
  split: test
phase_name: phase3
data_root: ${oc.env:PID_DATA_ROOT,data}
seed: 42
device: cuda
run_dir: runs
