[project]
name = "pid-recognition"
version = "0.1.0"
description = "Symbol detection and fine-grained classification in P&ID (detection-then-FGC pipeline)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nguyen Van Khoa" }]

# Runtime deps. Torch is pinned loosely; pick the CUDA/CPU wheel at install time
# (see README). Ultralytics pulls in torch/torchvision transitively but we list
# them so the FGC ResNet stage does not depend on the detector package.
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3",      # YOLOv8 detector (ref [27])
    "sahi>=0.11.20",         # overlap-preserving sliced inference (ref [40])
    "ensemble-boxes>=1.0.9", # Weighted Boxes Fusion for patch merge (ref [41])
    "timm>=1.0",             # ResNet-34 backbone for the FGC stage (ref [15])
    "hydra-core>=1.3",       # config-driven experiments / ablations
    "omegaconf>=2.3",
    "pycocotools>=2.0.7",    # canonical annotations.coco.json parsing
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "numpy>=1.26",
    "pandas>=2.2",           # manifest.csv
    "pyyaml>=6.0",           # classes.yaml
    "scikit-learn>=1.4",     # confusion matrices, macro-F1
    "matplotlib>=3.8",       # metric plots (confusion matrix, PR curves)
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
# Thin CLI wrappers over scripts/*. Each dispatches to a stage in src/pid/.
pid-prep-classes = "pid.data.build_classes:main"
pid-prep-yolo = "pid.data.coco_to_yolo:main"
pid-prep-tiles = "pid.data.tiling:main"
pid-prep-crops = "pid.data.extract_crops:main"
pid-prep-manifest = "pid.data.build_manifest:main"
pid-detect-train = "pid.detect.train:main"
pid-detect-infer = "pid.detect.infer:main"
pid-fgc-train = "pid.fgc.train:main"
pid-fgc-infer = "pid.fgc.infer:main"
pid-eval = "pid.eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
